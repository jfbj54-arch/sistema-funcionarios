<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Funcionário</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px #00000020;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #005fcc;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Cadastro de Funcionário</h2>

    <input id="nome" placeholder="Nome completo">
    <input id="cpf" placeholder="CPF">
    <input id="cargo" placeholder="Cargo desejado">
    <input id="telefone" placeholder="Telefone">
    <input id="email" placeholder="E-mail">
    <textarea id="experiencia" placeholder="Experiência profissional"></textarea>

    <button onclick="enviar()">Enviar</button>
  </div>

  <script>
    function enviar() {
      const funcionario = {
        nome: nome.value,
        cpf: cpf.value,
        cargo: cargo.value,
        telefone: telefone.value,
        email: email.value,
        experiencia: experiencia.value,
        status: "Pendente"
      };

      let lista = JSON.parse(localStorage.getItem("funcionarios")) || [];
      lista.push(funcionario);
      localStorage.setItem("funcionarios", JSON.stringify(lista));

      alert("Formulário enviado com sucesso!");
      location.reload();
    }
  </script>

</body>
</html>
