<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login RH</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: Arial;
  background: #e3f2fd;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.container {
  background: white;
  padding: 25px;
  border-radius: 10px;
  width: 90%;
  max-width: 350px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}
input {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 18px;
  background: #1e88e5;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}
button:hover {
  background: #1565c0;
}
</style>
</head>
<body>

<div class="container">
  <h2>Login RH</h2>
  <input type="text" id="user" placeholder="Usuário">
  <input type="password" id="pass" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<script>
function login() {
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;

  if (user === "rh" && pass === "123") {
    localStorage.setItem("logado", "sim");
    window.location.href = "rh.html";
  } else {
    alert("Usuário ou senha incorretos");
  }
}
</script>

</body>
</html>
