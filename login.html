<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login RH</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 90%;
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px #00000020;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #005fcc;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Login RH</h2>

    <input id="usuario" placeholder="Usuário">
    <input id="senha" type="password" placeholder="Senha">

    <button onclick="logar()">Entrar</button>
  </div>

  <script>
    function logar() {
      const user = usuario.value;
      const pass = senha.value;

      // LOGIN FIXO (pode mudar se quiser)
      const usuarioCorreto = "rh";
      const senhaCorreta = "1234";

      if (user === usuarioCorreto && pass === senhaCorreta) {
        alert("Login realizado com sucesso!");
        window.location.href = "rh.html";
      } else {
        alert("Usuário ou senha incorretos!");
      }
    }
  </script>

</body>
</html>
