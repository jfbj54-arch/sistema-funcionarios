<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel RH</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #00000020;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #007bff;
      color: white;
    }

    tr:nth-child(even) {
      background: #f9f9f9;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Funcionários Cadastrados</h2>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>CPF</th>
          <th>Cargo</th>
          <th>Telefone</th>
          <th>Email</th>
          <th>Experiência</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>

  <script>
    function carregar() {
      let lista = JSON.parse(localStorage.getItem("funcionarios")) || [];
      let tabela = document.getElementById("tabela");

      tabela.innerHTML = "";

      lista.forEach(func => {
        tabela.innerHTML += `
          <tr>
            <td>${func.nome}</td>
            <td>${func.cpf}</td>
            <td>${func.cargo}</td>
            <td>${func.telefone}</td>
            <td>${func.email}</td>
            <td>${func.experiencia}</td>
            <td>${func.status}</td>
          </tr>
        `;
      });
    }

    carregar();
  </script>

</body>
</html>
